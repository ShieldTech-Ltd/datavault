name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main, feat/demo-readiness-ritik, 'codex/**']

jobs:
  contracts:
    name: Contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Compile contracts
        run: npm run compile

      - name: Run contract tests
        run: npm run test:contracts

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: Route regression test
        run: npm test
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  worker:
    name: Worker typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install worker dependencies
        run: npm ci
        working-directory: worker

      - name: Typecheck
        run: npm run typecheck
        working-directory: worker

      - name: Unit tests
        run: npm run test
        working-directory: worker

  package:
    name: Cloudflare package dry run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            worker/package-lock.json
      - name: Install frontend and Worker dependencies
        run: |
          npm ci --prefix frontend
          npm ci --prefix worker
      - name: Build the actual static assets
        run: npm run build --prefix frontend
      - name: Verify asset security rules are in the build
        run: test -s frontend/dist/index.html && test -s frontend/dist/_headers
      - name: Bundle Worker and assets without deploying
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/datavault-bundle"
        working-directory: worker
