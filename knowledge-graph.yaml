project:
  name: DataVault Query License
  tagline: "Paid, controlled AI access to private knowledge collections"
  track: Trust, Identity & AI Infrastructure
  bounty: Dynamic SDK ($5,000)
  hackathon: Monad Metropolis
  deadline: "2026-10-14T04:59:00+01:00"
  freeze: "2026-10-12"
  repo: separate from DUSK project

# ─────────────────────────────────────────────
# PROBLEM
# ─────────────────────────────────────────────
problem:
  core: >
    AI companies use human-created content (photos, code, writing, voice)
    to train and run models. Creators receive no payment and gave no consent.
    Getty Images, NYT, and GitHub developers are all suing AI companies.
    The EU AI Act requires documented consent trails. No technical fix exists yet.
  why_unsolved_before: >
    On Ethereum, one consent transaction costs $0.50 and takes 12 seconds.
    At 10 million AI requests per day, the consent layer costs $5M in gas.
    The math does not work on any chain except Monad.
  why_monad_fixes_it: >
    On Monad, one transaction costs $0.001 and confirms in under 1 second.
    10 million requests per day costs $10,000 total. The math works.
    This product is impossible to build economically on any other chain.

# ─────────────────────────────────────────────
# SOLUTION
# ─────────────────────────────────────────────
solution:
  summary: >
    An owner uploads a private knowledge collection (document, guide, dataset).
    They set a per-query price and register policy on Monad.
    A buyer signs a Monad transaction placing payment in escrow.
    The system verifies payment, retrieves relevant passages, calls a real AI model,
    returns a cited answer, and settles escrow to the owner.
    The owner can pause access at any time, blocking future queries immediately.
  what_it_is_not:
    - Does not detect all AI use of someone's content across the internet
    - Does not prove copyright ownership (hash is integrity reference, not proof)
    - Cannot erase AI outputs already delivered
    - Cannot force unrelated AI companies to comply
    - Is not production-ready after the hackathon
  what_it_proves:
    - Consent plus payment at inference time is technically viable on Monad
    - The mechanism works end-to-end in a real deployed product
    - Monad is the only chain where this is economically feasible

# ─────────────────────────────────────────────
# ARCHITECTURE
# ─────────────────────────────────────────────
architecture:
  layers:
    - name: Frontend
      tech: React + Vite served as Cloudflare Worker Static Assets
      owner: Ritik
      responsibilities:
        - Owner dashboard (upload collection, set price, pause/resume)
        - Buyer dashboard (ask question, sign payment, view answer and receipt)
        - Dynamic SDK integration for sign-in and wallet signing

    - name: API Gate
      tech: Cloudflare Workers
      owner: Tanvir
      responsibilities:
        - Serve React app as static assets
        - POST /api/collections (register collection)
        - POST /api/collections/:id/upload (upload to private R2)
        - POST /api/queries/prepare (return price quote)
        - POST /api/queries/execute (verify payment, retrieve, call model, settle)
        - GET /api/queries/:id/receipt (return receipt)
        - Check on-chain policy before every retrieval
        - Replay protection via unique request IDs
        - Store credentials in Worker secrets, never expose R2 public URL

    - name: Storage
      tech: Cloudflare R2 (private) + Cloudflare D1
      owner: Tanvir
      responsibilities:
        - R2: store private collection documents
        - D1: store request state, receipts, collection metadata

    - name: Smart Contracts
      tech: Solidity on Monad testnet
      owner: Tanvir
      functions:
        - registerCollection(collectionId, owner, price, policyVersion, active)
        - updatePolicy(collectionId, price, active)
        - openQuery(requestId, collectionId, escrowAmount)
        - settleQuery(requestId, recipient)
        - refundExpired(requestId)
      storage_on_chain:
        - collection ID, owner address, price, policy version, active status
        - request ID, escrow state, receipt commitment
      never_on_chain:
        - prompts
        - source passages
        - model answers

    - name: Wallet and Identity
      tech: Dynamic SDK
      owner: Ritik
      usage:
        - Embedded wallets for owners and buyers (no crypto knowledge needed)
        - Sign Monad testnet transactions from the browser
        - Custom EVM network configuration for Monad
      dynamic_primitives_used:
        - embedded_wallets: true
        - agent_wallets: false
        - delegated_access: verify feasibility on day 1 before committing
      bounty_note: >
        Dynamic bounty bonus requires combining multiple primitives.
        Embedded wallets plus signing is the baseline.
        Add agent wallets or delegated access only if confirmed working on Monad testnet.

    - name: AI Model
      tech: Kimi API (first choice) or any real model provider (fallback)
      owner: Tanvir
      note: >
        Verify Kimi API access on day 1. If unavailable, switch to another
        real provider immediately. Do not simulate AI queries or payments.
        Passages retrieved from R2 are sent to the model. Tell owners this explicitly.

# ─────────────────────────────────────────────
# DATA FLOW
# ─────────────────────────────────────────────
data_flow:
  owner_setup:
    - Sign in with Dynamic (embedded wallet created)
    - Upload Markdown guide to private R2 bucket
    - Set price and active status
    - Worker calls registerCollection on Monad contract
    - Collection ID and policy version stored on-chain

  buyer_query:
    - Sign in with Dynamic (embedded wallet created)
    - Ask question, receive price quote from Worker
    - Sign Monad transaction: openQuery with escrow payment
    - Worker verifies transaction and current on-chain policy
    - Worker retrieves relevant passages from private R2
    - Worker calls real AI model with passages as context
    - Model returns cited answer
    - Worker calls settleQuery, escrow released to owner
    - Receipt stored in D1 with request ID, policy version, tx hash, passage IDs, response digest

  revocation:
    - Owner calls updatePolicy(active=false) on Monad
    - Worker checks policy before every retrieval
    - All future queries denied immediately
    - Already delivered answers are not affected

  failure_handling:
    - Model failure: answer withheld, buyer can call refundExpired after timeout
    - Worker timeout: same as model failure
    - Settlement failure: retry logic, escalate to refund path
    - Replay attack: D1 request ID uniqueness check blocks duplicate execution
    - Insufficient payment: Worker rejects before retrieval

