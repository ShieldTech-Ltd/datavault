project:
  name: DataVault
  tagline: Paid, controlled AI access to private knowledge collections
  hackathon: Monad Metropolis
  track: Trust, Identity & AI Infrastructure
  sponsor_bounties: []
  site: https://datavault.tamimtarafder12.workers.dev/
  repository: https://github.com/ShieldTech-Ltd/datavault
  status: submitted and ready for judging on 2026-10-14

components:
  frontend:
    technology: React, Vite, viem, injected EVM wallet
    routes:
      buyer: /query
      owner: /manage
      marketplace: /marketplace
      analytics: /analytics
  contract:
    technology: Solidity on Monad testnet
    chain_id: 10143
    address: "0x304aca9375fbd2f645e6c2d0318effa407766430"
    functions:
      - registerCollection
      - updatePolicy
      - openQuery
      - settleQuery
      - refundExpired
  worker:
    technology: Cloudflare Workers
    responsibilities:
      - verify wallet signatures and onchain policy
      - verify query payment
      - retrieve selected private passages
      - call a configured AI model
      - record cited answer and settle payment
  storage:
    private_content: Cloudflare R2
    requests_and_receipts: Cloudflare D1
  model:
    supported_providers: [anthropic, openai, kimi]
    public_demo_provider: anthropic

flow:
  - owner uploads content and registers collection policy
  - buyer reviews current price and opens escrow on Monad
  - worker verifies payment and active policy
  - worker retrieves selected passages and requests a cited answer
  - worker records answer and settles payment to owner
  - buyer receives answer after settlement
  - buyer can recover a completed answer or refund an unsettled escrow after timeout

limits:
  - wallet control does not prove identity or copyright ownership
  - public receipts omit private question, answer, and source passages
  - pause blocks future service access, not answers already delivered
  - sponsor SDK bounties were not part of the submitted entry

evidence:
  judge_quickstart: docs/demo-quickstart.md
  api_contract: docs/api-contract.md
  deployment: docs/deployment.md
  security: docs/security.md
