# ─────────────────────────────────────────────
# DEMO SCRIPT (90 seconds)
# ─────────────────────────────────────────────
demo:
  tool: Higgsfield for visual opening, real app footage for everything else
  rule: Do not generate or fake app screens, wallet prompts, AI answers, or transactions
  steps:
    1: Owner sets price and enables the collection
    2: Buyer asks a real question, Dynamic wallet signs escrow payment
    3: Cited AI answer appears, Monad transaction visible, receipt shown
    4: Owner pauses collection, next buyer request denied before retrieval
    5: Voiceover states the limitation plainly

# ─────────────────────────────────────────────
# DONE CRITERIA
# ─────────────────────────────────────────────
done_means:
  - Public website deployed
  - Working Monad contract deployed to testnet
  - Dynamic sign-in and real transaction signing working
  - Private gated retrieval working
  - Real AI model answer with citations
  - Successful settlement and failure refund paths both tested
  - Inspectable receipt in UI
  - Public repo with setup instructions
  - Demo video matches the live product exactly

# ─────────────────────────────────────────────
# KEY RISKS
# ─────────────────────────────────────────────
risks:
  - risk: Kimi API access unavailable
    mitigation: Switch to OpenAI or Anthropic on day 1, make no Kimi claim
    priority: critical

  - risk: Dynamic agent wallet delegation not confirmed on Monad testnet
    mitigation: Do not make it deadline-critical, use embedded wallets plus signing as baseline
    priority: high

  - risk: Escrow settlement edge cases discovered late
    mitigation: Oct 9-10 dedicated to failure paths, not polish
    priority: high

  - risk: Demo content (knowledge collection) too narrow for judges
    mitigation: Use universally relatable content, not niche UK guide
    priority: medium

  - risk: Submission write-up left to last minute
    mitigation: Write Dynamic integration description on Oct 12 during freeze
    priority: medium

# ─────────────────────────────────────────────
# PITCH FRAMING
# ─────────────────────────────────────────────
pitch:
  hook: >
    You post photos on Instagram. Meta uses those photos to train their AI.
    Someone types your name and gets a realistic image of you.
    You never agreed. You got paid nothing. Meta made millions.
    This is happening right now to millions of people.
    There are lawsuits but no technical fix. Until now.
  monad_line: >
    On Ethereum this costs $5 million per day in gas fees. On Monad it costs $10,000.
    DataVault only exists because of Monad.
  limitation_line: >
    This controls access through participating services.
    It does not stop every AI company today.
    It is the infrastructure that makes ethical AI economics possible.
  market: >
    AI training data market: $2.3 billion in 2024, growing 35% per year.
    EU AI Act compliance is a mandatory requirement for every AI company in Europe.
    DataVault is the consent and payment rail for that market.
